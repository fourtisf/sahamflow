<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="45%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#c79a2e"/>
    </linearGradient>
    <linearGradient id="goldGradText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="60%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#c79a2e"/>
    </linearGradient>
    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Mark: rounded square with stylized S formed by chart flow -->
  <g transform="translate(8 8)">
    <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#goldGrad)"/>
    <!-- inner glow -->
    <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Stylized S as price chart flow -->
    <path d="M 16 44 Q 24 52 32 44 T 48 24 Q 44 18 36 22 Q 28 26 20 24"
          stroke="#1a1200" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- candle dots -->
    <circle cx="20" cy="24" r="2.3" fill="#1a1200"/>
    <circle cx="48" cy="24" r="2.3" fill="#1a1200"/>
  </g>

  <!-- Wordmark: Saham + flow -->
  <text x="88" y="52" font-family="'Sora', system-ui, sans-serif" font-weight="700" font-size="32" letter-spacing="-1.2" fill="#f5f5f3">Saham<tspan fill="url(#goldGradText)">flow</tspan></text>
</svg>
