<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#c79a2e"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="60%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#c79a2e"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Mark (icon) -->
  <g transform="translate(20 20)">
    <rect x="0" y="0" width="160" height="160" rx="32" fill="url(#bg2)" stroke="url(#gold2)" stroke-width="2"/>
    <ellipse cx="80" cy="12" rx="60" ry="24" fill="#ffd24a" opacity="0.12"/>
    <text x="80" y="115" text-anchor="middle"
          font-family="'Sora', 'Inter', sans-serif" font-weight="800" font-size="130" letter-spacing="-8"
          fill="url(#gold2)" filter="url(#glow2)">S</text>
    <g transform="translate(106 38)">
      <path d="M 0 18 L 10 8 L 20 14 L 30 2" stroke="url(#gold2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 24 2 L 30 2 L 30 8" stroke="url(#gold2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="210" y="125"
        font-family="'Sora', 'Inter', sans-serif" font-weight="700" font-size="84" letter-spacing="-3"
        fill="#f5f5f3">Saham<tspan fill="url(#goldText)">flow</tspan></text>

  <!-- Tagline -->
  <text x="212" y="158"
        font-family="'JetBrains Mono', monospace" font-weight="500" font-size="16" letter-spacing="3"
        fill="#a8a8a2" text-transform="uppercase">BUY-SIDE INTEL · IHSG</text>
</svg>
