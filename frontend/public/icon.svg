<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#c79a2e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background: dark with subtle gold border -->
  <rect x="6" y="6" width="244" height="244" rx="48" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Subtle ambient glow top -->
  <ellipse cx="128" cy="20" rx="100" ry="40" fill="#ffd24a" opacity="0.12"/>

  <!-- Bold S monogram in gold -->
  <text x="128" y="178" text-anchor="middle"
        font-family="'Sora', 'Inter', -apple-system, sans-serif"
        font-weight="800" font-size="200" letter-spacing="-12"
        fill="url(#gold)" filter="url(#glow)">S</text>

  <!-- Upward trend mark: ascending line top-right -->
  <g transform="translate(168 56)">
    <path d="M 0 30 L 16 14 L 32 22 L 48 4"
          stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- arrow tip -->
    <path d="M 40 4 L 48 4 L 48 12"
          stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
