<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c79a2e"/>
      <stop offset="50%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#ffe699"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#16a85a"/>
      <stop offset="100%" stop-color="#22e07a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square dark background -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#gold)" stroke-width="3"/>

  <!-- Subtle ambient glow top -->
  <ellipse cx="256" cy="40" rx="180" ry="60" fill="#ffd24a" opacity="0.12"/>

  <!-- Trend line behind, faded -->
  <path d="M 90 400 L 180 330 L 270 250 L 360 170 L 432 95"
        stroke="url(#gold)" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>

  <!-- Candle 1 (ascending, green) -->
  <line x1="160" y1="290" x2="160" y2="410" stroke="url(#green)" stroke-width="6" stroke-linecap="round"/>
  <rect x="132" y="315" width="56" height="80" fill="url(#green)" rx="5"/>

  <!-- Candle 2 (ascending higher, green) -->
  <line x1="256" y1="210" x2="256" y2="390" stroke="url(#green)" stroke-width="6" stroke-linecap="round"/>
  <rect x="228" y="235" width="56" height="135" fill="url(#green)" rx="5"/>

  <!-- Candle 3 (climax, gold gradient) -->
  <line x1="352" y1="130" x2="352" y2="370" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <rect x="324" y="160" width="56" height="195" fill="url(#gold)" rx="5" filter="url(#glow)"/>

  <!-- Arrow tip atop climax candle -->
  <path d="M 312 138 L 352 100 L 392 138"
        stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"
        filter="url(#glow)"/>
</svg>
