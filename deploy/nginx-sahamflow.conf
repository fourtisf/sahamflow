# Sahamflow reverse proxy: Next.js frontend (PM2 :3000) + FastAPI backend (:8000).
# MVP: listen on port 80 by IP (no domain yet). When api/app domain is pointed at
# this VPS, set server_name and run:
#   sudo certbot --nginx -d sahamflow.com
# certbot rewrites this block to add the 443 listener + TLS automatically.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;            # replace with sahamflow.com once DNS is ready

    client_max_body_size 4m;

    # Backend API -> FastAPI. The frontend calls /api/v1/... (relative).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Backend health + interactive docs (handy during setup).
    location = /health { proxy_pass http://127.0.0.1:8000/health; access_log off; }
    location /docs { proxy_pass http://127.0.0.1:8000/docs; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; }

    # Everything else -> Next.js frontend.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
