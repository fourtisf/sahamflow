# Sahamflow API reverse proxy.
# MVP: listen on port 80 by IP (no domain yet). When api.sahamflow.com is
# pointed at this VPS, set server_name and run:
#   sudo certbot --nginx -d api.sahamflow.com
# certbot will rewrite this block to add the 443 listener + TLS automatically.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;            # replace with api.sahamflow.com once DNS is ready

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
